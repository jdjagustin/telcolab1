mongodb:
  enabled: false  # kept disabled on purpose (see commit abaf034 'Lab: disable Bitnami subchart and deploy custom mongo:4.4.29 for Open5GS'): this cluster deploys its own hand-rolled Mongo via templates/lab-mongodb.yaml instead of the Bitnami subchart, because the Bitnami mongodb image tags this chart pins (e.g. bitnami/mongodb:4.4.15-debian-10-r8) were moved to the unsupported bitnamilegacy registry after Broadcom's Aug 2025 deprecation of free Bitnami images -- re-enabling this subchart would silently duplicate the Deployment/Service already provided by lab-mongodb.yaml. Real persistence for Mongo is provided by a PVC in lab-mongodb.yaml instead (fixed 2026-09-02, see that file).
