apiVersion: v1
kind: Service
metadata:
  name: lab-open5gs-mongodb
  labels:
    app: lab-open5gs-mongodb
spec:
  selector:
    app: lab-open5gs-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-open5gs-mongodb
  labels:
    app: lab-open5gs-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-open5gs-mongodb
  template:
    metadata:
      labels:
        app: lab-open5gs-mongodb
    spec:
      # Run mongod directly as the image's built-in `mongodb` user (uid/gid 999)
      # instead of the default entrypoint, which starts as root and drops
      # privileges with `gosu`. On 2026-11-02 `gosu` was observed hanging inside the
      # container before exec, so mongod never started while the pod still
      # reported Running.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: mongodb
          image: mongo:4.4.29
          imagePullPolicy: IfNotPresent
          command:
            - mongod
          args:
            - "--bind_ip_all"
          env:
            - name: MONGO_INITDB_DATABASE
              value: open5gs
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-open5gs-mongodb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-open5gs-mongodb
  labels:
    app: lab-open5gs-mongodb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
